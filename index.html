<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14233f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LCM">
<title>Llantas Camión Medellín</title>
<meta name="description" content="Cotiza llantas para camión, flota y maquinaria. Cobertura nacional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#14233f; --navy-d:#0c1729; --ink:#0e1828; --orange:#ef7d2a; --orange-d:#d96a1a;
  --steel:#aebfd6; --steel-l:#e7eef8; --line:#d8e0ec; --muted:#6c7a90;
  --bg:#eef2f7; --card:#fff; --ok:#1e9e5a; --warn:#e0a800; --bad:#c0392b; --wa:#25d366;
  --shadow:0 8px 30px rgba(20,35,63,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.hide{display:none!important}

/* ============ LOGIN ============ */
#login{position:fixed;inset:0;background:linear-gradient(125deg,#0a1524,#16294a 55%,#1d3258);display:grid;place-items:center;z-index:80;overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
#login::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 8px);pointer-events:none}
.lcard{position:relative;z-index:1;width:100%;max-width:380px;background:#fff;border-radius:18px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.42)}
.lcard img{height:56px;display:block;margin:0 auto 18px}
.lcard h1{font-family:'Saira Condensed';font-size:22px;color:var(--navy);text-align:center;letter-spacing:.7px}
.lcard p.s{text-align:center;font-size:12.5px;color:var(--muted);margin:5px 0 20px}
.lcard label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.lcard input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:14px;background:#fbfcfe}
.lcard input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px rgba(239,125,42,.12)}
.lcard .btn-in{width:100%;padding:14px;border-radius:11px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.8px}
.lcard .btn-in:hover{background:var(--navy-d)}
.lcard .btn-in:disabled{opacity:.55;cursor:wait}
.lcard .back{display:block;width:100%;text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);text-decoration:underline}
.lerr{background:#fdeceb;color:var(--bad);font-size:12.5px;padding:10px 12px;border-radius:9px;margin-bottom:12px;display:none;line-height:1.5}
.lerr.on{display:block}

/* ============ TOP ============ */
.top{background:linear-gradient(120deg,#0c1729,#16294a 55%,#1d3258);color:#fff;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 7px);pointer-events:none}
.top{padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;position:relative;z-index:1;
  padding:13px max(18px,env(safe-area-inset-right,0px)) 13px max(18px,env(safe-area-inset-left,0px))}
.top img{height:44px}
.top .tt b{display:block;font-family:'Saira Condensed';font-weight:700;font-size:19px;letter-spacing:.6px}
.top .tt span{font-size:11px;color:#b8c6dd}
.top .sp{flex:1}
.top .who{font-size:11px;color:#cdd8ea;text-align:right;line-height:1.45}
.top .gh{font-size:11px;color:#dbe4f2;border:1px solid rgba(255,255,255,.28);padding:8px 13px;border-radius:9px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-left:10px}
.top .gh:hover{background:rgba(255,255,255,.12);color:#fff}
@media(max-width:700px){.top .who{display:none}.top .tt span{display:none}}
@media(max-width:560px){
  .top-in{padding-top:10px;padding-bottom:10px;gap:9px}
  .top img{height:34px}
  .top .tt b{font-size:15px;letter-spacing:.4px}
  .top .gh{padding:9px 11px;font-size:10.5px;margin-left:4px;white-space:nowrap}
  .nav button{padding:12px 11px;font-size:12.5px}
  .wrap{padding:14px 12px}
  .hd h1{font-size:21px}
}
@media(max-width:380px){
  .top img{height:29px}
  .top .tt b{font-size:13.5px}
  .top .gh{padding:8px 9px;font-size:10px}
}

/* ============ NAV ============ */
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
@supports(-webkit-touch-callout:none){.nav{position:static}}
.nav-in{max-width:1280px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav button{padding:14px 15px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px}
.nav button:hover{color:var(--navy)}
.nav button.on{color:var(--navy);border-bottom-color:var(--orange)}
.nav .ico{font-size:15px}

.wrap{max-width:1280px;margin:0 auto;padding:18px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.hd h1{font-family:'Saira Condensed';font-size:24px;color:var(--navy);text-transform:uppercase;letter-spacing:.8px}
.hd .sp{flex:1}

/* ============ CARDS / UI ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch h2{font-family:'Saira Condensed';font-size:16px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.7px}
.ch .tag{margin-left:auto;font-size:10.5px;color:var(--muted);background:var(--steel-l);padding:4px 9px;border-radius:20px;font-weight:600}
.cb{padding:15px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.5fr 1fr}
.g2b{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1.35fr 1fr}
@media(max-width:920px){.g2,.g2b,.g3{grid-template-columns:1fr}}

.btn{padding:11px 15px;border-radius:10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.14s;border:1px solid transparent}
.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy-d)}
.btn.acc{background:var(--orange);color:#fff}.btn.acc:hover{background:var(--orange-d)}
.btn.gh{background:#fff;border-color:var(--line);color:var(--navy)}.btn.gh:hover{border-color:var(--steel);background:#f7f9fc}
.btn.wa{background:var(--wa);color:#fff}
.btn.dg{background:#fff;border-color:#f0c8c3;color:var(--bad)}.btn.dg:hover{background:#fdeceb}
.btn.sm{padding:8px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.blk{width:100%}

.fld{margin-bottom:11px}
.fld label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--orange);background:#fff}
.fld textarea{min-height:64px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 11px}
.fgrid .full{grid-column:1/-1}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}

.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--navy);color:#fff}
.seg.acc button.on{background:var(--orange)}

.search{position:relative}
.search input{width:100%;padding:13px 14px 13px 40px;font-size:15px;border:2px solid var(--line);border-radius:11px;background:#fbfcfe}
.search input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px rgba(239,125,42,.11)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.filbar{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin-bottom:4px}
.fmini{display:flex;flex-direction:column;gap:3px}
.fmini label{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.fmini input,.fmini select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;font-size:13px}
.fmini input:focus,.fmini select:focus{outline:none;border-color:var(--orange);background:#fff}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;padding:0 8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:9px 8px;border-bottom:1px solid #eef2f7;vertical-align:middle}
tr:last-child td{border-bottom:none}
td.nm{font-weight:600}
td.num{font-family:'IBM Plex Mono';font-size:12.5px;white-space:nowrap}
tr.clk:hover{background:#f7f9fc;cursor:pointer}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.pill.ok{background:#e4f6ec;color:var(--ok)}
.pill.wr{background:#fdf3d9;color:#9a7500}
.pill.bd{background:#fdeceb;color:var(--bad)}
.pill.nt{background:var(--steel-l);color:#3a5179}
.rank{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--steel-l);color:var(--navy);font-size:11px;font-weight:700;margin-right:8px;font-family:'IBM Plex Mono'}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--steel)}
.kpi.a::before{background:var(--orange)} .kpi.b::before{background:var(--navy)}
.kpi.c::before{background:var(--ok)} .kpi.d::before{background:var(--bad)}
.kpi .l{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.kpi .v{font-family:'Saira Condensed';font-weight:800;font-size:27px;color:var(--navy);line-height:1.15;margin-top:4px}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi .d b{color:var(--ok);font-weight:700} .kpi .d b.dn{color:var(--bad)}

.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.65}
.empty .ic{font-size:30px;opacity:.35;margin-bottom:8px}
.load{padding:56px;text-align:center;color:var(--muted);font-size:14px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;margin:0 auto 12px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.modal{position:fixed;inset:0;background:rgba(10,21,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:70;padding:20px;overflow:auto;backdrop-filter:blur(2px)}
.modal.open{display:flex}
.mcard{background:#fff;border-radius:16px;width:100%;max-width:600px;margin:auto;box-shadow:0 24px 70px rgba(0,0,0,.32)}
.mcard.wide{max-width:820px}
.mh{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line)}
.mh h2{font-family:'Saira Condensed';font-size:18px;color:var(--navy);text-transform:uppercase;letter-spacing:.6px}
.mh .x{margin-left:auto;font-size:20px;color:var(--muted);width:30px;height:30px;border-radius:8px}
.mh .x:hover{background:var(--steel-l);color:var(--navy)}
.mb{padding:16px 17px}
.mf{padding:0 17px 17px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:99;opacity:0;transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.bad{background:var(--bad)}

.chart{width:100%;height:240px}
.lg{display:flex;gap:15px;font-size:11.5px;color:var(--muted);margin-top:9px;flex-wrap:wrap}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.axle{position:relative;height:32px;border-radius:9px;overflow:hidden;background:var(--steel-l);display:flex;margin:8px 0 14px}
.axle span{display:block;height:100%;position:relative}
.axle .s{background:linear-gradient(100deg,var(--navy),#27436f)}
.axle .l{background:linear-gradient(100deg,var(--orange),#ffa65c)}
.axle b{position:absolute;top:50%;transform:translateY(-50%);left:11px;color:#fff;font-family:'IBM Plex Mono';font-size:11.5px;font-weight:600}
.srow{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.srow .n{font-family:'Saira Condensed';font-weight:700;font-size:15px;color:var(--navy)}
.srow .p{margin-left:auto;font-family:'IBM Plex Mono';font-size:12.5px;color:var(--muted)}
.srow .m{font-family:'Saira Condensed';font-weight:800;font-size:19px;color:var(--navy)}

/* ============ COTIZADOR ============ */
.res{display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;background:#fff}
.res:hover{border-color:var(--steel);box-shadow:0 4px 14px rgba(20,35,63,.06)}
.res .info{flex:1;min-width:0}
.res .d{font-size:13px;font-weight:600;line-height:1.25}
.res .meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{background:var(--steel-l);color:#3a5179;padding:2px 7px;border-radius:6px;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.res .pr{text-align:right;white-space:nowrap}
.res .pr .big{font-family:'Saira Condensed';font-weight:700;font-size:17px;color:var(--navy)}
.res .pr .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.addb{background:var(--navy);color:#fff;border-radius:10px;width:36px;height:36px;font-size:21px;display:grid;place-items:center;flex-shrink:0}
.addb:hover{background:var(--orange)}
.results{max-height:56vh;overflow:auto;margin-top:11px}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it .it-top{display:flex;align-items:flex-start;gap:8px}
.it .nm{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.25}
.it .sub{font-size:11px;color:var(--muted);margin-top:3px}
.it .sub .piso{color:var(--orange-d);font-weight:600}
.it .sub .mod{color:var(--orange-d);font-weight:700}
.it .it-ctrl{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.it .cu{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:2px 8px}
.it .cu input{width:88px;height:28px;border:none;text-align:right;font-size:13px;font-weight:700;color:var(--navy);background:transparent}
.it .cu input:focus{outline:none}
.it .cu.over{border-color:var(--orange);background:#fff7f0}
.it .lt{margin-left:auto;text-align:right;font-family:'Saira Condensed';font-weight:700;font-size:16px;color:var(--navy)}
.it .rm{color:var(--bad);font-size:17px;width:24px;text-align:center;opacity:.5}
.it .rm:hover{opacity:1}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:30px;height:32px;background:#f1f5fa;color:var(--navy);font-size:18px;font-weight:700}
.qty input{width:40px;height:32px;border:none;text-align:center;font-size:14px;font-weight:600}
.qty input:focus{outline:none}
.total-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding:14px 16px;background:linear-gradient(100deg,var(--orange),var(--orange-d));border-radius:12px;color:#fff}
.total-row .l{font-family:'Saira Condensed';font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:1px}
.total-row .v{font-family:'Saira Condensed';font-weight:800;font-size:25px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.note{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55}

/* ============ PRINT ============ */
#print-root{display:none}
@media print{
  body{background:#fff}
  .top,.nav,.wrap,.modal,.toast,#login{display:none!important}
  #print-root{display:block}
  @page{size:letter;margin:14mm}
}
.pr-head{display:flex;gap:16px;border-bottom:3px solid var(--navy);padding-bottom:12px}
.pr-head img{height:62px}
.pr-head .co{font-size:11px;color:#444;line-height:1.5}
.pr-head .co .big{font-family:'Saira Condensed';font-weight:700;font-size:21px;color:var(--navy)}
.pr-title{font-family:'Saira Condensed';font-weight:700;font-size:20px;color:var(--navy);margin:15px 0 9px}
.pr-cli{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px;font-size:12.5px;margin-bottom:13px}
.pr-cli span{color:#666;font-weight:600;min-width:78px;display:inline-block}
table.pr{width:100%;border-collapse:collapse;font-size:12px}
table.pr th{background:var(--navy);color:#fff;font-family:'Saira Condensed';text-align:left;padding:7px 9px}
table.pr th.r,table.pr td.r{text-align:right}
table.pr td{padding:7px 9px;border-bottom:1px solid #e2e8f0}
.pr-tot{display:flex;justify-content:flex-end;margin-top:12px}
.pr-tot .box{background:var(--orange);color:#fff;padding:9px 18px;border-radius:8px;display:flex;gap:22px;align-items:center}
.pr-tot .box .l{font-family:'Saira Condensed';font-weight:700;font-size:16px}
.pr-tot .box .v{font-family:'Saira Condensed';font-weight:800;font-size:20px}
.pr-cond{margin-top:17px;font-size:10.5px;color:#555;line-height:1.7}
.pr-cond .h{font-family:'Saira Condensed';font-weight:700;color:var(--orange-d);font-size:12px;letter-spacing:.5px;margin-bottom:3px}
.pr-pay{margin-top:13px;border:2px solid var(--orange);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--navy)}
.pr-pay b{font-family:'Saira Condensed';color:var(--orange-d)}
/* ===== PROMOS + SECCIONES PÚBLICAS ===== */
.promo-wrap{margin-bottom:15px}
.promo{position:relative;border-radius:15px;overflow:hidden;box-shadow:var(--shadow);background:var(--navy);min-height:150px;display:block}
.promo img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.promo .ov{position:relative;z-index:1;padding:26px 28px;background:linear-gradient(90deg,rgba(12,23,41,.82),rgba(12,23,41,.35) 70%,transparent);min-height:150px;display:flex;flex-direction:column;justify-content:center}
.promo .ov h3{font-family:'Saira Condensed';font-size:24px;color:#fff;text-transform:uppercase;letter-spacing:.5px;line-height:1.05;max-width:60%}
.promo .ov p{color:#dbe4f2;font-size:14px;margin-top:6px;max-width:55%}
.promo.noimg .ov{background:linear-gradient(100deg,var(--navy),#1d3258)}
.promo.plain{aspect-ratio:3/1;min-height:0}
.promo.plain img{position:relative}
@supports not (aspect-ratio:3/1){.promo.plain{min-height:0;padding-bottom:33.3%;position:relative}.promo.plain img{position:absolute}}
.promo-dots{display:flex;gap:6px;justify-content:center;margin-top:9px}
.promo-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer}
.promo-dots i.on{background:var(--orange);width:20px;border-radius:4px}
@media(max-width:640px){.promo .ov h3,.promo .ov p{max-width:100%}}

.pub-sec{margin-top:16px}
.pub-sec .eyebrow{font-size:11px;font-weight:700;color:var(--orange-d);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
.pub-sec h2{font-family:'Saira Condensed';font-size:22px;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.pub-sec .intro{color:var(--muted);font-size:14px;margin-bottom:14px;max-width:70ch}
.lineas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.linea{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.linea .li{width:40px;height:40px;border-radius:10px;background:var(--steel-l);display:grid;place-items:center;margin-bottom:11px}
.linea .li svg{width:22px;height:22px;stroke:var(--navy);fill:none;stroke-width:2}
.linea h3{font-family:'Saira Condensed';font-size:17px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.linea p{font-size:13px;color:var(--muted);line-height:1.55}
.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.why{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px}
.why .num{font-family:'Saira Condensed';font-size:22px;color:var(--orange);line-height:1}
.why h4{font-size:14px;color:var(--navy);margin-bottom:3px}
.why p{font-size:12.5px;color:var(--muted);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .c{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--navy)}
.pay-row{display:flex;flex-wrap:wrap;gap:10px}
.pay-row .p{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--navy)}
.pay-row .p svg{width:20px;height:20px;stroke:var(--orange);fill:none;stroke-width:2}
.pub-foot{text-align:center;color:var(--muted);font-size:12.5px;padding:24px 0 8px;line-height:1.8}
.pub-cta{background:linear-gradient(100deg,var(--navy),#1d3258);border-radius:15px;padding:26px;text-align:center;color:#fff;margin-top:16px}
.pub-cta h2{font-family:'Saira Condensed';font-size:24px;color:#fff;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.pub-cta p{color:#cdd8ea;font-size:14px;margin-bottom:16px}
</style>
</head>

async function api(path, opts={}){
  const r = await fetch(PB+path, {...opts, headers:{'Content-Type':'application/json',
    ...(TOKEN?{'Authorization':TOKEN}:{}) , ...(opts.headers||{})}});
  const t = await r.text(); let j=null; try{ j=JSON.parse(t); }catch(e){}
  if(!r.ok){
    let msg=(j&&j.message)||('HTTP '+r.status);
    if(j&&j.data){ const k=Object.keys(j.data)[0]; if(k) msg+=' ('+k+': '+(j.data[k].message||'')+')'; }
    throw new Error(msg);
  }
  return j;
}
async function pbAll(col, extra){
  let page=1, out=[];
  while(page<=30){
    const r = await api(`/api/collections/${col}/records?page=${page}&perPage=500${extra||''}`);
    out = out.concat(r.items||[]);
    if(!r.totalPages || page>=r.totalPages) break;
    page++;
  }
  return out;
}
const pbCreate = (col, body) => api(`/api/collections/${col}/records`, {method:'POST', body:JSON.stringify(body)});
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function track(tipo, ref){
  try{
    const r = await fetch(PB+'/api/collections/visitas/records', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({tipo, dia:hoyISO(), ref:ref||''})});
    return r.ok;
  }catch(e){ return false; }
}
// evita contar la misma visita muchas veces en la sesión (marca SOLO si el registro se guardó)
async function trackOnce(tipo, ref){
  let k='';
  try{ k='lcm_v_'+tipo+'_'+hoyISO();
    if(sessionStorage.getItem(k)) return;
  }catch(e){}
  const ok = await track(tipo, ref);
  if(ok && k){ try{ sessionStorage.setItem(k,'1'); }catch(e){} }
}

    if(!items.length) break;
    for(let i=0;i<items.length;i+=20){
      await Promise.all(items.slice(i,i+20).map(x=>pbDelete(col, x.id).catch(()=>{})));
      borrados+=Math.min(20, items.length-i);
      if(onProg) onProg(borrados);
    }
  }
  return borrados;
}

async function doAuth(mail, pass){
  let last='';
  for(const col of ['users','_superusers']){
    try{
      const r = await fetch(PB+'/api/collections/'+col+'/auth-with-password',{method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify({identity:mail, password:pass})});
      if(r.ok){ const j=await r.json();
        return {token:j.token, email:(j.record&&j.record.email)||mail, id:(j.record&&j.record.id)||'', col}; }
      last='Correo o contraseña incorrectos.';
    }catch(e){ last='No se pudo conectar con el servidor.'; }
  }
  throw new Error(last||'No se pudo iniciar sesión.');
}

/* ================= PRECIOS ================= */
function plazoMeses(){ return plazoLibre ? Math.max(0, plazoDiasLibre/30) : plazoM; }
function plazoDias(){ return plazoLibre ? Math.max(0, Math.round(plazoDiasLibre)) : plazoM*30; }
function plazoFactor(m){ return m<=0 ? 1 : (1 + SET.tasa*m + SET.prima); }
function priceFor(v, m){ const R=SET.round||1; return Math.round(v*plazoFactor(m)/R)*R; }
function pisoFor(c, m){ const R=SET.round||1; return Math.round(c*plazoFactor(m)/R)*R; }
function licUnit(c){ const u=SET.util; const f=(u>0&&u<1)?1/(1-u):1; const R=SET.round||1; return Math.round(c*f/R)*R; }
function methodCom(){ return metodo==='addi' ? SET.addi : (metodo==='mp' ? SET.mp : 0); }
function grossUnit(base, c){ const f=(c>0&&c<1)?1/(1-c):1; const R=SET.round||1; return Math.round(base*f/R)*R; }
function metodoLabel(m){ return m==='addi'?'Addi':(m==='mp'?'tarjeta de crédito':'efectivo / transferencia'); }
const isLic = () => modo==='licitacion';
const refOf = it => it.manual ? it : (DATA.productos.find(p=>p.id===it.pid) || {descripcion:'—',marca:'',costo:0,venta:0});
function autoBase(r){ return isLic() ? (r.costo?licUnit(r.costo):(r.venta||0)) : priceFor(r.venta||0, plazoMeses()); }
function lineBase(it){ return (it.price!=null) ? it.price : autoBase(refOf(it)); }
function lineClient(it){ const b=lineBase(it); return isLic()? b : grossUnit(b, methodCom()); }
function plazoLbl(){ const d=plazoDias(); return d<=0 ? 'contado' : d+' días'; }

function barChart(series){
  if(!series.length) return '<div class="empty">Sin datos en este periodo.</div>';
  const w=680,h=240,padL=52,padR=12,padT=14,padB=32;
  const iw=w-padL-padR, ih=h-padT-padB;
  const max=Math.max(...series.map(s=>s.venta),1);
  const gap=iw/series.length, bw=Math.max(6, Math.min(44, gap*0.6));
  let bars='',labels='',ticks=''; const pts=[];
  series.forEach((s,i)=>{
    const x=padL+gap*i+gap/2, hv=(s.venta/max)*ih;
    bars+=`<rect x="${(x-bw/2).toFixed(1)}" y="${(padT+ih-hv).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hv,1).toFixed(1)}" rx="3" fill="url(#gv)"><title>${s.lbl}: ${fmt(s.venta)}</title></rect>`;
    pts.push([x, padT+ih-(s.util/max)*ih]);
    if(series.length<=14 || i%2===0) labels+=`<text x="${x.toFixed(1)}" y="${h-12}" text-anchor="middle" font-size="10.5" fill="#6c7a90">${s.lbl}</text>`;
  });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const line=`<path d="${path}" fill="none" stroke="#ef7d2a" stroke-width="2.2" stroke-linejoin="round"/>`+
    pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#fff" stroke="#ef7d2a" stroke-width="2"><title>${series[i].lbl} · utilidad ${fmt(series[i].util)}</title></circle>`).join('');
  for(let i=0;i<=3;i++){ const y=padT+ih-(ih/3)*i;
    ticks+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="#eef2f7"/>`
        +  `<text x="${padL-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#aebfd6">${fmtK(max/3*i)}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ventas y utilidad por mes">
    <defs><linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#27436f"/><stop offset="100%" stop-color="#14233f"/></linearGradient></defs>
    ${ticks}${bars}${line}${labels}</svg>
    <div class="lg"><span><i style="background:#14233f"></i>Ventas</span><span><i style="background:#ef7d2a"></i>Utilidad</span></div>`;
}

async function renderPromos(){
  const box=$('#promoWrap'); if(!box) return;

  if(!promos.length){ box.innerHTML=''; return; }
  const slide=p=>{
    const tieneTexto = (p.titulo&&p.titulo.trim()) || (p.subtitulo&&p.subtitulo.trim());
    const inner = tieneTexto ? `<div class="ov">${p.titulo?`<h3>${esc(p.titulo)}</h3>`:''}${p.subtitulo?`<p>${esc(p.subtitulo)}</p>`:''}</div>` : '';
    const body=`${p.imagen?`<img src="${esc(p.imagen)}" alt="${esc(p.titulo||'Promoción')}" onerror="this.style.display='none'">`:''}${inner}`;
    const cls = 'promo'+(p.imagen?'':' noimg')+(tieneTexto?'':' plain');
    return p.link ? `<a class="${cls}" href="${esc(p.link)}" target="_blank" rel="noopener">${body}</a>`
                  : `<div class="${cls}">${body}</div>`; };
  if(promos.length===1){ box.innerHTML=slide(promos[0]); return; }
  box.innerHTML=`<div id="promoSlide">${slide(promos[0])}</div>
    <div class="promo-dots">${promos.map((_,i)=>`<i class="${i===0?'on':''}" data-pd="${i}"></i>`).join('')}</div>`;
  let idx=0;

    $$('.promo-dots i').forEach((d,j)=>d.classList.toggle('on', j===idx)); };
  clearInterval(window._promoT);
  window._promoT=setInterval(()=>{ if($('#promoSlide')) go(idx+1); else clearInterval(window._promoT); }, 5000);

}

function cartTotals(){
  let cliente=0, base=0, costo=0, unds=0;
  cart.forEach(it=>{ const r=refOf(it);
    cliente += lineClient(it)*it.qty; base += lineBase(it)*it.qty;
    costo += (r.costo||0)*it.qty; unds += it.qty; });
  return {cliente, base, costo, unds, util: base-costo};
}

      cl = await pbCreate('clientes', {nombre, nit:g('v_nit'), telefono:g('v_tel'), direccion:g('v_dir'),

      await pbCreate('cartera', {cliente:cl.id, cliente_nombre:nombre, venta:rec.id, factura:g('v_fac'),

/* ================= TABLERO ================= */
let PER='all';
function inPer(d){
  if(!d) return false;
  if(PER==='all') return true;
  if(PER==='y1') return d>=new Date(2025,6,1) && d<=new Date(2026,5,30,23,59);
  const n=parseInt(PER,10), lim=new Date(); lim.setMonth(lim.getMonth()-n);
  return d>=lim;
}
function renderTablero(){
  const V=DATA.ventas.filter(v=>inPer(v._d)), E=DATA.egresos.filter(v=>inPer(v._d));
  const head = `<div class="hd"><h1>Tablero</h1><div class="sp"></div>
    <div class="seg" id="segPer">
      ${[['all','Todo'],['y1','Jul 25 – Jun 26'],['12','12 meses'],['6','6 meses']].map(([k,l])=>`<button data-per="${k}" class="${PER===k?'on':''}">${l}</button>`).join('')}
    </div></div>`;
  if(!DATA.ventas.length){
    $('#view').innerHTML = head + `<div class="card"><div class="empty"><div class="ic">📊</div>
      Todavía no hay ventas registradas.<br>Registra la primera desde el cotizador.</div></div>`; return;
  }
  const ventas=sum(V,'valor_venta'), costo=sum(V,'valor_costo'), inter=sum(V,'intereses');
  const util=sum(V,'utilidad'), santi=sum(V,'parte_santi'), luis=sum(V,'parte_luis');
  const unds=sum(V,'cantidad'), n=V.length;
  const egrTot=sum(E,'valor'), egrOp=sumOp(E), egrMerc=egrTot-egrOp;
  const neta=util-egrOp;
  const margen=ventas?util/ventas:0, ticket=n?ventas/n:0;

  const ord=[...V].filter(v=>v._d).sort((a,b)=>a._d-b._d);
  let dV=null,dU=null;
  if(ord.length>=6){ const mid=Math.floor(ord.length/2), a=ord.slice(0,mid), b=ord.slice(mid);
    const av=sum(a,'valor_venta'), bv=sum(b,'valor_venta'), au=sum(a,'utilidad'), bu=sum(b,'utilidad');
    if(av) dV=(bv-av)/av; if(au) dU=(bu-au)/au; }
  const arrow=d=>d===null?'':`<b class="${d<0?'dn':''}">${d>=0?'▲':'▼'} ${pct(Math.abs(d))}</b> vs. anterior`;

  const bym=new Map();
  V.forEach(v=>{ if(!v._d) return;

      <div class="cb tbl-wrap"><table><thead><tr><th>Cliente</th><th class="r">Ventas</th><th class="r">Utilidad</th><th class="r">#</th></tr></thead><tbody>
      ${topc.map((c,i)=>`<tr><td class="nm"><span class="rank">${i+1}</span>${esc(c.k)}</td><td class="r num">${fmt(c.venta)}</td><td class="r num">${fmt(c.util)}</td><td class="r num">${c.n}</td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="card"><div class="ch"><h2>Ventas por proveedor</h2><span class="tag">${byp.size}</span></div>
      <div class="cb tbl-wrap"><table><thead><tr><th>Proveedor</th><th class="r">Ventas</th><th class="r">Costo</th><th class="r">Utilidad</th><th class="r">Margen</th></tr></thead><tbody>

      </tbody></table></div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="ch"><h2>Compras a proveedores</h2><span class="tag">${fmt(comprasTot)} en ${compras.reduce((t,c)=>t+c.n,0)} pagos</span></div>
    <div class="cb tbl-wrap">${compras.length?`
      <table><thead><tr><th>Proveedor</th><th class="r">Pagos</th><th class="r">Total comprado</th><th class="r">Participación</th><th style="width:130px">Peso</th></tr></thead><tbody>
      ${compras.map((c,i)=>`<tr><td class="nm"><span class="rank">${i+1}</span>${esc(c.k)}</td>
        <td class="r num">${c.n}</td><td class="r num" style="font-weight:600">${fmt(c.val)}</td>
        <td class="r num">${comprasTot?pct(c.val/comprasTot):'—'}</td>
        <td><div style="height:8px;background:var(--steel-l);border-radius:5px;overflow:hidden">
          <div style="height:100%;width:${comprasTot?(c.val/comprasTot*100).toFixed(1):0}%;background:linear-gradient(90deg,var(--navy),#3d5a8a)"></div></div></td></tr>`).join('')}
      </tbody></table>
      <p class="note">Suma de los egresos clasificados como <b>compra de mercancía</b>. Si un pago aparece en el proveedor equivocado, edítalo en la pestaña Movimientos y llena el campo Proveedor.</p>`
      :`<div class="empty"><div class="ic">📦</div>No hay compras de mercancía registradas en este periodo.</div>`}
    </div></div>
  <p class="note" style="text-align:center;margin-top:18px">${DATA.productos.length} referencias · ${DATA.clientes.length} clientes · datos en vivo desde tu servidor</p>`;
}

function verVenta(id){ modalEditVenta(id); }
function fillCliente(nombre, pref){
  const c=DATA.clientes.find(x=>norm(x.nombre)===norm((nombre||'').trim())); if(!c) return;
  const set=(sfx,val)=>{ const el=$('#'+pref+sfx); if(el && !el.value) el.value=val||''; };
  const setF=(sfx,val)=>{ const el=$('#'+pref+sfx); if(el) el.value=val||''; };
  setF('nit', c.nit); setF('tel', c.telefono); setF('ciu', c.ciudad);
  setF('dir', c.direccion); setF('dep', c.departamento);
}
function modalEditVenta(id){

  if($('#e_car')){

  $('#eSave').addEventListener('click', ()=>saveVentaEdit(v));

async function saveVentaEdit(v){
  const g=id=>($('#'+id)&&$('#'+id).value||'').trim();
  const nombre=g('e_cli');
  if(!nombre){ toast('Escribe el cliente', true); return; }
  if(!g('e_fec')){ toast('Escribe la fecha', true); return; }
  const val=num($('#e_val').value), i=num($('#e_int').value), c=num($('#e_cos').value);
  const u=val+i-c, sa=Math.round(u*SET.pctSanti), lu=Math.round(u-sa);
  const btn=$('#eSave'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  try{
    let cl=DATA.clientes.find(x=>norm(x.nombre)===norm(nombre));
    if(!cl){ cl=await pbCreate('clientes', {nombre, nit:g('e_nit'), telefono:g('e_tel'),
        direccion:g('e_dir'), ciudad:g('e_ciu'), departamento:g('e_dep'), tipo:'persona', segmento:'otro'});
      DATA.clientes.push(cl);
    } else {
      const patch={}; if(g('e_nit')&&!cl.nit) patch.nit=g('e_nit');
      if(g('e_tel')&&!cl.telefono) patch.telefono=g('e_tel');
      if(g('e_dir')&&!cl.direccion) patch.direccion=g('e_dir');
      if(g('e_ciu')&&!cl.ciudad) patch.ciudad=g('e_ciu');
      if(g('e_dep')&&!cl.departamento) patch.departamento=g('e_dep');
      if(Object.keys(patch).length){ try{ const r=await pbUpdate('clientes', cl.id, patch); Object.assign(cl,r); }catch(e){} }
    }
    const body={ fecha:pbDate(g('e_fec')), factura:g('e_fac'), cliente:cl.id, cliente_nombre:nombre,
      nit:g('e_nit'), telefono:g('e_tel'), direccion:g('e_dir'), ciudad:g('e_ciu'), departamento:g('e_dep'),
      descripcion:g('e_desc'), cantidad:Math.round(num($('#e_und').value)),
      valor_venta:val, intereses:i, valor_costo:c, utilidad:u, parte_santi:sa, parte_luis:lu,
      forma_pago:$('#e_fp').value, estado_pago:$('#e_ep').value, proveedor:g('e_prov') };
    if(v){ const r=await pbUpdate('ventas', v.id, body); Object.assign(v, r); v._d=new Date(v.fecha); toast('Venta actualizada'); }
    else {
      const r=await pbCreate('ventas', body); r._d=new Date(r.fecha); DATA.ventas.push(r);
      if($('#e_car') && $('#e_car').checked){
        let vencISO=g('e_venc');
        if(!vencISO){ const venc=new Date(g('e_fec')||iso(hoy())); venc.setDate(venc.getDate()+30); vencISO=iso(venc); }
        const vencida = new Date(vencISO) < hoy();
        await pbCreate('cartera', {cliente:cl.id, cliente_nombre:nombre, venta:r.id, factura:g('e_fac'),
          fecha_venta:pbDate(g('e_fec')), fecha_vence:pbDate(vencISO), valor_total:val+i, abonado:0,
          saldo:val+i, estado: vencida?'vencida':'al_dia', notas:g('e_desc')});
        DATA.cartera=await pbAll('cartera');
      }
      toast('Venta registrada');
    }
    closeModal(); render();
  }catch(e){ toast('Error: '+e.message, true); if(btn){ btn.disabled=false; btn.textContent=v?'Guardar cambios':'Guardar venta'; } }
}

/* ================= CARTERA ================= */
function renderCartera(){
  const f=FIL.cartera, q=norm(f.q);
  const estOf=c=>{ if(c.saldo<=0) return 'pagada';
    if(c.fecha_vence && new Date(c.fecha_vence)<hoy()) return 'vencida';
    return c.abonado>0 ? 'parcial' : 'al_dia'; };
  const list=[...DATA.cartera]
    .filter(c=>!q || norm((c.cliente_nombre||'')+' '+(c.notas||'')+' '+(c.factura||'')).includes(q))
    .filter(c=>!f.estado || estOf(c)===f.estado)
    .sort((a,b)=>new Date(a.fecha_vence||0)-new Date(b.fecha_vence||0));
  const saldo=sum(list,'saldo'), abon=sum(list,'abonado'), tot=sum(list,'valor_total');
  const venc=list.filter(c=>c.saldo>0 && c.fecha_vence && new Date(c.fecha_vence)<hoy());
  const est=c=>{ if(c.saldo<=0) return ['ok','Pagada'];
    if(c.fecha_vence && new Date(c.fecha_vence)<hoy()) return ['bd','Vencida'];
    const d=c.fecha_vence?Math.ceil((new Date(c.fecha_vence)-hoy())/864e5):null;
    if(d!==null && d<=8) return ['wr','Vence en '+d+'d'];
    return ['nt', c.abonado>0?'Abono parcial':'Al día']; };
  $('#view').innerHTML = `
  <div class="hd"><h1>Cartera</h1><div class="sp"></div>
    <button class="btn gh sm" id="btnXls">⬇️ Excel</button>
    <button class="btn acc sm" id="btnNewCar">＋ Nueva factura</button></div>
  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi b"><div class="l">Total facturado</div><div class="v">${fmt(tot)}</div><div class="d">${list.length} facturas</div></div>
    <div class="kpi c"><div class="l">Abonado</div><div class="v">${fmt(abon)}</div><div class="d">${tot?pct(abon/tot):'—'} recaudado</div></div>
    <div class="kpi a"><div class="l">Saldo por cobrar</div><div class="v">${fmt(saldo)}</div><div class="d">pendiente</div></div>
    <div class="kpi ${venc.length?'d':''}"><div class="l">Vencida</div><div class="v">${fmt(sum(venc,'saldo'))}</div><div class="d">${venc.length} factura${venc.length===1?'':'s'}</div></div>
  </div>
  <div class="card"><div class="cb">${filBar('cartera',
      filSel('cartera','estado','Estado',[['al_dia','Al día'],['parcial','Abono parcial'],['vencida','Vencida'],['pagada','Pagada']],f.estado))}</div>
  <div class="cb tbl-wrap" style="padding-top:0">${list.length?`
    <table><thead><tr><th>Cliente</th><th>Referencia</th><th class="r">Valor</th><th class="r">Abonado</th><th class="r">Saldo</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody>
    ${list.map(c=>{ const [cl,tx]=est(c); return `<tr class="clk" data-car="${c.id}">
      <td class="nm">${esc(c.cliente_nombre||'—')}</td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)">${esc(c.notas||'')}</td>
      <td class="r num">${fmt(c.valor_total)}</td><td class="r num">${fmt(c.abonado)}</td>
      <td class="r num" style="font-weight:600">${fmt(c.saldo)}</td>
      <td class="num">${c.fecha_vence?new Date(c.fecha_vence).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'2-digit'}):'—'}</td>
      <td><span class="pill ${cl}">${tx}</span></td>
      <td class="r" style="white-space:nowrap"><button class="btn acc sm" data-abono="${c.id}">Abonar</button>
        <button class="btn wa sm" data-recordar="${c.id}" title="Recordar por WhatsApp" style="margin-left:5px">📲</button>
        <button class="btn gh sm" data-cdel="${c.id}" title="Eliminar" style="margin-left:5px">✕</button></td></tr>`; }).join('')}
    </tbody></table>`:`<div class="empty"><div class="ic">⏳</div>No hay facturas en cartera.</div>`}
  </div></div>`;
}
function recordarCartera(id){
  const c=DATA.cartera.find(x=>x.id===id); if(!c) return;
  const cl=DATA.clientes.find(x=>x.id===c.cliente || norm(x.nombre)===norm(c.cliente_nombre||''));
  let tel=(cl&&cl.telefono||'').replace(/[^0-9]/g,'');
  const vencida = c.fecha_vence && new Date(c.fecha_vence)<hoy();
  const fv = c.fecha_vence ? new Date(c.fecha_vence).toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'}) : '';
  const saludo = (cl&&cl.nombre||c.cliente_nombre||'').split(' ')[0] || 'Buen día';
  const msg = `Hola ${saludo}, te saluda Llantas Camión Medellín.\n\n`+
    (vencida
      ? `Te recordamos que tu factura${c.factura?' N° '+c.factura:''} se encuentra *vencida* desde el ${fv}.\n`
      : `Te recordamos el pago de tu factura${c.factura?' N° '+c.factura:''}${fv?', con vencimiento el '+fv:''}.\n`)+
    `Saldo pendiente: *${fmt(c.saldo)}*` +
    (c.notas?`\nReferencia: ${c.notas}`:'') +
    `\n\nAgradecemos tu pago. Cualquier duda, con gusto te ayudamos. 🚛`;
  const abrir = t => window.open('https://wa.me/'+t+'?text='+encodeURIComponent(msg.replace(/\\n/g,'\n')), '_blank');
  if(tel){
    if(tel.length<=10) tel='57'+tel;
    abrir(tel);
  } else {
    // sin teléfono: abre WhatsApp para elegir contacto y copia el mensaje
    navigator.clipboard && navigator.clipboard.writeText(msg.replace(/\\n/g,'\n')).catch(()=>{});
    toast('Sin teléfono guardado · mensaje copiado, elige el contacto', true);
    window.open('https://wa.me/?text='+encodeURIComponent(msg.replace(/\\n/g,'\n')), '_blank');
  }
}
function modalAbono(id){

async function cargarVisitas(){
  let ev=[];
  try{ ev = await pbAll('visitas', '&fields=tipo,dia,created'); }
  catch(e){ $('#view').querySelector('.load').outerHTML='<div class="card"><div class="empty"><div class="ic">📈</div>No se pudieron cargar las visitas.<br>'+esc(e.message)+'</div></div>'; return; }

  const hoyStr=hoyISO();
  const d=new Date(); const semAtras=new Date(d); semAtras.setDate(d.getDate()-6);
  const mesStr=hoyStr.slice(0,7);
  const cuenta=(tipo, filtro)=>ev.filter(e=>e.tipo===tipo && filtro(e.dia)).length;
  const enSemana=dia=>{ const x=new Date(dia+'T00:00:00'); return x>=new Date(semAtras.toISOString().slice(0,10)+'T00:00:00'); };

  const vHoy=cuenta('visita',x=>x===hoyStr), cHoy=cuenta('cotiza',x=>x===hoyStr), wHoy=cuenta('whatsapp',x=>x===hoyStr);
  const vSem=cuenta('visita',enSemana), cSem=cuenta('cotiza',enSemana), wSem=cuenta('whatsapp',enSemana);
  const vMes=cuenta('visita',x=>x.startsWith(mesStr)), cMes=cuenta('cotiza',x=>x.startsWith(mesStr)), wMes=cuenta('whatsapp',x=>x.startsWith(mesStr));
  const vTot=ev.filter(e=>e.tipo==='visita').length, cTot=ev.filter(e=>e.tipo==='cotiza').length, wTot=ev.filter(e=>e.tipo==='whatsapp').length;
  const conv = vMes ? (wMes/vMes) : 0;

  // serie últimos 14 días
  const dias=[];
  for(let i=13;i>=0;i--){ const x=new Date(); x.setDate(x.getDate()-i);
    const k=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
    dias.push({k, lbl:x.getDate()+'/'+(x.getMonth()+1),
      v:ev.filter(e=>e.tipo==='visita'&&e.dia===k).length,
      w:ev.filter(e=>e.tipo==='whatsapp'&&e.dia===k).length}); }

  $('#view').innerHTML = `<div class="hd"><h1>Visitas al cotizador</h1><div class="sp"></div>
    <button class="btn gh sm" id="btnRefV">🔄 Actualizar</button></div>
  <div class="kpis">
    <div class="kpi b"><div class="l">Visitas hoy</div><div class="v">${vHoy}</div><div class="d">esta semana ${vSem} · mes ${vMes}</div></div>
    <div class="kpi a"><div class="l">Cotizaciones armadas</div><div class="v">${cMes}</div><div class="d">este mes · hoy ${cHoy}</div></div>
    <div class="kpi c"><div class="l">Enviadas por WhatsApp</div><div class="v">${wMes}</div><div class="d">este mes · hoy ${wHoy}</div></div>
    <div class="kpi"><div class="l">Conversión del mes</div><div class="v">${pct(conv)}</div><div class="d">visitas que escriben a WhatsApp</div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="ch"><h2>Visitas por día</h2><span class="tag">últimos 14 días</span></div>
    <div class="cb">${barVisitas(dias)}
      <div class="lg"><span><i style="background:#14233f"></i>Visitas</span><span><i style="background:#25d366"></i>WhatsApp</span></div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="ch"><h2>Resumen del embudo</h2></div>
    <div class="cb tbl-wrap"><table><thead><tr><th>Etapa</th><th class="r">Hoy</th><th class="r">Semana</th><th class="r">Mes</th><th class="r">Histórico</th></tr></thead><tbody>
      <tr><td class="nm">👁️ Visitas</td><td class="r num">${vHoy}</td><td class="r num">${vSem}</td><td class="r num">${vMes}</td><td class="r num">${vTot}</td></tr>
      <tr><td class="nm">🧾 Cotizaciones armadas</td><td class="r num">${cHoy}</td><td class="r num">${cSem}</td><td class="r num">${cMes}</td><td class="r num">${cTot}</td></tr>
      <tr><td class="nm">📲 Enviadas por WhatsApp</td><td class="r num">${wHoy}</td><td class="r num">${wSem}</td><td class="r num">${wMes}</td><td class="r num">${wTot}</td></tr>
    </tbody></table>
    <p class="note">Una <b>visita</b> es alguien que abre el cotizador. <b>Cotización armada</b> = agregó al menos una llanta. <b>WhatsApp</b> = te envió el pedido (el cliente potencial más valioso). Se cuenta una vez por persona al día.</p>
    </div></div>`;
  $('#btnRefV').addEventListener('click', renderVisitas);
}
function barVisitas(dias){
  const w=680,h=220,padL=34,padR=12,padT=12,padB=30, iw=w-padL-padR, ih=h-padT-padB;
  const max=Math.max(...dias.map(d=>d.v),1);
  const gap=iw/dias.length, bw=Math.max(6,Math.min(30,gap*0.5));
  let bars='',labels='',wa='',ticks='';
  dias.forEach((d,i)=>{ const x=padL+gap*i+gap/2, hv=(d.v/max)*ih;
    bars+=`<rect x="${(x-bw/2).toFixed(1)}" y="${(padT+ih-hv).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hv,0).toFixed(1)}" rx="3" fill="#14233f"><title>${d.lbl}: ${d.v} visitas</title></rect>`;
    if(d.w>0){ const hw=(d.w/max)*ih; wa+=`<rect x="${(x-bw/2).toFixed(1)}" y="${(padT+ih-hw).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hw,0).toFixed(1)}" rx="3" fill="#25d366"><title>${d.lbl}: ${d.w} por WhatsApp</title></rect>`; }
    labels+=`<text x="${x.toFixed(1)}" y="${h-12}" text-anchor="middle" font-size="10" fill="#6c7a90">${d.lbl}</text>`; });
  for(let i=0;i<=2;i++){ const y=padT+ih-(ih/2)*i;
    ticks+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#eef2f7"/><text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#aebfd6">${Math.round(max/2*i)}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${ticks}${bars}${wa}${labels}</svg>`;
}

  $('#prCancel').addEventListener('click', closeModal);

    if(!confirm('¿Eliminar esta promoción?')) return;
    try{ await pbDelete('promos', p.id); closeModal(); toast('Promoción eliminada'); renderPromoList(); }

    const tit=($('#pr_tit').value||'').trim();

  });

function modalLista(){
  openModal('Subir lista de precios del mes', `
    <p class="note" style="margin-bottom:12px">Selecciona tu archivo Excel (.xlsx) con la lista del mes. Debe tener las columnas:
    <b>DESCRIPCION REFERENCIA</b>, <b>MARCA</b>, <b>APLICACION</b>, <b>TIPO</b>, <b>PRECIO</b> (costo) y <b>PRECIO VENTA</b>.</p>
    <input type="file" id="lst_file" accept=".xlsx,.xls" style="width:100%;padding:11px;border:1.5px dashed var(--line);border-radius:10px;background:#fbfcfe">
    <div id="lst_prev" style="margin-top:13px"></div>`,
    `<button class="btn gh" id="lstCancel">Cancelar</button>
     <button class="btn acc" id="lstGo" disabled>Procesar archivo</button>`, true);
  let filas=[];
  $('#lstCancel').addEventListener('click', closeModal);
  $('#lst_file').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf, {type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      // localizar la fila de encabezados
      let hi=-1;
      for(let i=0;i<Math.min(rows.length,10);i++){
        const t=rows[i].map(x=>norm(x)).join('|');
        if(t.includes('descripcion') && t.includes('venta')){ hi=i; break; }
      }
      if(hi<0){ $('#lst_prev').innerHTML='<p class="note" style="color:var(--bad)">No encontré la fila de encabezados (DESCRIPCION… PRECIO VENTA). Revisa el archivo.</p>'; return; }
      const head=rows[hi].map(x=>norm(x));
      const col = name => head.findIndex(h=>h.includes(name));
      const cD=col('descripcion'), cM=col('marca'), cA=col('aplicacion'), cT=col('tipo');
      let cV=head.findIndex(h=>h.includes('venta'));
      let cC=head.findIndex(h=>h==='precio' || (h.includes('precio') && !h.includes('venta')));
      filas=[];
      for(let i=hi+1;i<rows.length;i++){
        const r=rows[i]; const d=(r[cD]||'').toString().trim();
        if(!d) continue;
        const venta=Math.round(num(r[cV])), costo=cC>=0?Math.round(num(r[cC])):0;
        if(!(venta>0)) continue;
        filas.push({descripcion:d, marca:(r[cM]||'').toString().trim(), aplicacion:(r[cA]||'').toString().trim(),
          tipo:cT>=0?(r[cT]||'').toString().trim():'', costo, venta});
      }
      if(!filas.length){ $('#lst_prev').innerHTML='<p class="note" style="color:var(--bad)">No se leyeron referencias con precio de venta. Revisa las columnas.</p>'; return; }
      // comparar con lo existente
      const idx=new Map(DATA.productos.map(p=>[norm(p.descripcion), p]));
      let nuevas=0, camb=0, igual=0;
      filas.forEach(f=>{ const p=idx.get(norm(f.descripcion));
        if(!p) nuevas++;
        else if((+p.venta||0)!==f.venta || (+p.costo||0)!==f.costo) camb++;
        else igual++; });
      $('#lst_prev').innerHTML=`<div style="background:var(--steel-l);border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.9">
        Leídas: <b>${filas.length}</b> referencias<br>
        🆕 Nuevas: <b style="color:var(--ok)">${nuevas}</b><br>
        🔄 Con cambio de precio o costo: <b style="color:var(--orange-d)">${camb}</b><br>
        ✔️ Sin cambios: <b>${igual}</b></div>`;
      $('#lstGo').disabled=false;
    }catch(x){ $('#lst_prev').innerHTML='<p class="note" style="color:var(--bad)">No se pudo leer el archivo: '+esc(x.message)+'</p>'; }
  });
  $('#lstGo').addEventListener('click', async ()=>{
    if(!filas.length) return;
    if(!confirm(`Esta lista de ${filas.length} referencias REEMPLAZARÁ por completo el catálogo actual (${DATA.productos.length} referencias).\n\nLas anteriores se eliminan y quedan solo estas. ¿Continuar?`)) return;
    const btn=$('#lstGo'); btn.disabled=true;
    try{
      // 1) borrar todo lo anterior
      btn.textContent='Limpiando anterior…';
      await pbWipe('productos', n=>{ btn.textContent='Limpiando… '+n; });
      DATA.productos=[];
      // 2) cargar la lista nueva
      let ok=0, err=0;
      for(let i=0;i<filas.length;i+=20){
        const tanda=filas.slice(i,i+20);
        await Promise.all(tanda.map(async f=>{
          try{ const r=await pbCreate('productos', {descripcion:f.descripcion, marca:f.marca,
                 aplicacion:f.aplicacion, costo:f.costo, venta:f.venta, activo:true});
               DATA.productos.push(r); ok++; }
          catch(x){ err++; }
        }));
        btn.textContent='Cargando… '+ok+'/'+filas.length;
      }
      closeModal();
      toast(`Catálogo reemplazado · ${ok} referencias`+(err?`, ${err} con error`:''), err>0);
      render();
      if(confirm('¿Publicar el catálogo público ahora con esta lista? (también reemplaza lo que ve el cliente)')) publicarCatalogo();
    }catch(x){ toast('Error: '+x.message, true); btn.disabled=false; btn.textContent='Procesar archivo'; }
  });
}
async function publicarCatalogo(){
  if(!DATA.productos.length){ toast('No hay productos', true); return; }
  if(!confirm('Se publicarán '+DATA.productos.length+' referencias (sin costos) al catálogo que ve el cliente.\nEsto reemplaza por completo el catálogo público anterior. ¿Continuar?')) return;
  const btn=$('#btnPub'); btn.disabled=true; btn.textContent='Publicando…';
  try{
    // reemplazo total: vaciar el catálogo público y volver a copiarlo desde productos
    btn.textContent='Limpiando anterior…';
    await pbWipe('catalogo', n=>{ btn.textContent='Limpiando… '+n; });
    let ok=0, err=0;
    for(let i=0;i<DATA.productos.length;i+=20){
      const tanda=DATA.productos.slice(i,i+20);
      await Promise.all(tanda.map(async p=>{
        try{ await pbCreate('catalogo', {descripcion:p.descripcion, marca:p.marca||'',
               aplicacion:p.aplicacion||'', venta:+p.venta||0}); ok++; }
        catch(e){ err++; }
      }));
      btn.textContent='Publicando… '+ok+'/'+DATA.productos.length;
    }
    await loadCatalogo();
    toast('Catálogo publicado · '+ok+' referencias'+(err?', '+err+' con error':''), err>0);
    render();
  }catch(e){ toast('Error: '+e.message, true); }
  btn.disabled=false; btn.textContent='🌐 Publicar catálogo público';
}

    '#':i+1, 'FECHA':v._d?iso(v._d):'', 'CLIENTE':v.cliente_nombre||'', 'NIT/CC':(DATA.clientes.find(c=>c.id===v.cliente)||{}).nit||'',

    'SANTI':+v.parte_santi||0, 'LUIS':+v.parte_luis||0, 'FORMA PAGO':v.forma_pago||'',
    'ESTADO':v.estado_pago||'', 'FACTURA':v.factura||'', 'PROVEEDOR':v.proveedor||'',

  if(V.length){ const n=V.length+2;

      'SANTI':{f:`SUM(K2:K${n-1})`},'LUIS':{f:`SUM(L2:L${n-1})`}}); }

    'NOMBRE':c.nombre||'', 'NIT/CC':c.nit||'', 'CONTACTO':c.contacto||'', 'TELÉFONO':c.telefono||'',
    'CORREO':c.email||'', 'DIRECCIÓN':c.direccion||'', 'CIUDAD':c.ciudad||'', 'DEPARTAMENTO':c.departamento||'',

  XLSX.utils.book_append_sheet(wb, sheetFrom([...DATA.ingresos].sort((a,b)=>(a._d||0)-(b._d||0)).map((e,i)=>({
    '#':i+1, 'FECHA':e._d?iso(e._d):'', 'CONCEPTO':e.concepto||'', 'MEDIO':MEDIOS[e.medio]||e.medio||'',
    'REFERENCIA':e.referencia||'', 'TOTAL':+e.valor||0}))), 'Ingresos');

  XLSX.utils.book_append_sheet(wb, sheetFrom(DATA.productos.map(p=>({
    'DESCRIPCION REFERENCIA':p.descripcion||'', 'MARCA':p.marca||'', 'APLICACION':p.aplicacion||'',
    'PRECIO':+p.costo||0, 'PRECIO VENTA':+p.venta||0}))), 'Productos');

  const V2=DATA.ventas;
  XLSX.utils.book_append_sheet(wb, sheetFrom([
    {'CONCEPTO':'Ventas', 'VALOR':sum(V2,'valor_venta')},
    {'CONCEPTO':'Intereses', 'VALOR':sum(V2,'intereses')},
    {'CONCEPTO':'Costo mercancía', 'VALOR':sum(V2,'valor_costo')},

    {'CONCEPTO':'Egresos', 'VALOR':sum(DATA.egresos,'valor')},
    {'CONCEPTO':'Ingresos recibidos', 'VALOR':sum(DATA.ingresos,'valor')},
    {'CONCEPTO':'Utilidad neta', 'VALOR':sum(V2,'utilidad')-sum(DATA.egresos,'valor')},
    {'CONCEPTO':'Cartera por cobrar', 'VALOR':sum(DATA.cartera,'saldo')},
    {'CONCEPTO':'Generado', 'VALOR':new Date().toLocaleString('es-CO')}
  ]), 'Resumen');

  XLSX.writeFile(wb, 'LCM-Respaldo-'+iso(hoy())+'.xlsx');
  toast('Respaldo descargado');
}
function exportTab(){
  if(typeof XLSX==='undefined'){ toast('No se pudo cargar el generador de Excel', true); return; }
  exportBackup();
}

/* ================= ROUTER ================= */
function render(){
  if(!TOKEN){ renderPublic(); return; }
  $('#nav').classList.remove('hide');
  $('#topTitle').textContent='CRM · LLANTAS CAMIÓN MEDELLÍN';
  $('#topSub').textContent='Gestión comercial';
  $('#btnAccess').textContent='Salir';
  $('#who').textContent=USER;
  $$('#navIn button').forEach(b=>b.classList.toggle('on', b.dataset.t===TAB));
  ({cotizar:renderCotizar, tablero:renderTablero, ventas:renderVentas,
    clientes:renderClientes, cartera:renderCartera, movs:renderMovs, visitas:renderVisitas, ajustes:renderAjustes}[TAB]||renderCotizar)();
}

/* ================= EVENTOS GLOBALES ================= */
document.addEventListener('click', async e=>{
  let b;
  /* nav */
  if(b=e.target.closest('#navIn button')){ TAB=b.dataset.t; render(); return; }
  /* público */
  if(b=e.target.closest('[data-padd]')){
    const r=DATA.catalogo.find(x=>x.id===b.dataset.padd); if(!r) return;
    if(!cart.length) trackOnce('cotiza');
    const ex=cart.find(x=>x.id===r.id);
    if(ex) ex.qty++; else cart.push({...r, qty:1});
    renderPublicCart(); toast('Agregado'); return; }
  if(b=e.target.closest('[data-prm]')){ cart.splice(+b.dataset.prm,1); renderPublicCart(); return; }
  if(b=e.target.closest('[data-pinc]')){ cart[+b.dataset.pinc].qty++; renderPublicCart(); return; }
  if(b=e.target.closest('[data-pdec]')){ const i=cart[+b.dataset.pdec]; i.qty=Math.max(1,i.qty-1); renderPublicCart(); return; }
  if(e.target.id==='pWa'){ publicWa(); return; }
  if(e.target.id==='pClr'){ cart=[]; renderPublicCart(); return; }
  if(e.target.id==='pPdf'){ buildPublicPrint(); window.print(); return; }
  /* cotizador */
  if(b=e.target.closest('#segModo button')){ modo=b.dataset.m; render(); return; }
  if(b=e.target.closest('#segPlazo button')){
    if(b.dataset.p==='x'){ plazoLibre=true; }
    else { plazoLibre=false; plazoM=+b.dataset.p; }
    $$('#segPlazo button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const w=$('#plazoLibreWrap'); if(w) w.classList.toggle('hide', !plazoLibre);
    if(plazoLibre){ const el=$('#plazoDias'); if(el){ el.focus(); el.select(); } }
    renderResults(); renderCart(); return; }
  if(b=e.target.closest('#segPago button')){ metodo=b.dataset.g;
    $$('#segPago button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); renderCart(); return; }
  if(b=e.target.closest('[data-add]')){ addItem(b.dataset.add); return; }
  if(b=e.target.closest('[data-rm]')){ cart.splice(+b.dataset.rm,1); renderCart(); return; }
  if(b=e.target.closest('[data-inc]')){ cart[+b.dataset.inc].qty++; renderCart(); return; }
  if(b=e.target.closest('[data-dec]')){ const i=cart[+b.dataset.dec]; i.qty=Math.max(1,i.qty-1); renderCart(); return; }
  if(e.target.id==='btnMan'){ modalManual(); return; }
  if(e.target.id==='btnPrint'){ buildPrint(); window.print(); return; }
  if(e.target.id==='btnClear'){ cart=[]; renderCart(); return; }
  if(e.target.id==='btnNueva'){ cart=[]; ['c_cli','c_nit','c_con','c_ciu','c_pay'].forEach(id=>{ if($('#'+id)) $('#'+id).value=''; }); renderCart(); toast('Cotización nueva'); return; }
  if(e.target.id==='btnGuardar'){ await guardarCotizacion(); return; }
  if(e.target.id==='btnVenta'){ modalVenta(); return; }
  /* ventas */
  if(b=e.target.closest('[data-vdel]')){ e.stopPropagation();
    if(!confirm('¿Eliminar esta venta?')) return;
    try{ await pbDelete('ventas', b.dataset.vdel); DATA.ventas=DATA.ventas.filter(x=>x.id!==b.dataset.vdel);
         toast('Venta eliminada'); render(); }catch(x){ toast('Error: '+x.message,true); } return; }
  if(b=e.target.closest('[data-ven]')){ verVenta(b.dataset.ven); return; }
  if(e.target.id==='btnNewVenta'){ modalEditVenta(null); return; }
  /* clientes */
  if(b=e.target.closest('[data-cli]')){ modalCliente(b.dataset.cli); return; }
  if(e.target.id==='btnNewCli'){ modalCliente(null); return; }
  /* cartera */
  if(b=e.target.closest('[data-abono]')){ e.stopPropagation(); modalAbono(b.dataset.abono); return; }
  if(b=e.target.closest('[data-recordar]')){ e.stopPropagation(); recordarCartera(b.dataset.recordar); return; }
  if(b=e.target.closest('[data-cdel]')){ e.stopPropagation();
    const c=DATA.cartera.find(x=>x.id===b.dataset.cdel);
    if(!confirm('¿Eliminar esta factura de cartera'+(c?' de '+c.cliente_nombre:'')+'?')) return;
    try{ await pbDelete('cartera', b.dataset.cdel);
         DATA.cartera=DATA.cartera.filter(x=>x.id!==b.dataset.cdel); toast('Factura eliminada'); render(); }
    catch(x){ toast('Error: '+x.message, true); } return; }
  if(b=e.target.closest('[data-car]')){ modalCartera(b.dataset.car); return; }
  if(e.target.id==='btnNewCar'){ modalCartera(null); return; }
  /* movimientos */
  if(b=e.target.closest('#segMov button')){ movTab=b.dataset.mv; renderMovs(); return; }
  if(e.target.id==='btnNewMov'){ modalMov(null); return; }
  if(b=e.target.closest('[data-mov]')){ modalMov(b.dataset.mov); return; }
  if(b=e.target.closest('[data-mdel]')){
    e.stopPropagation();
    if(!confirm('¿Eliminar este movimiento?')) return;
    const col = movTab==='egresos' ? 'egresos':'ingresos';
    try{ await pbDelete(col, b.dataset.mdel);
         DATA[col]=DATA[col].filter(x=>x.id!==b.dataset.mdel); toast('Eliminado'); render(); }
    catch(x){ toast('Error: '+x.message,true); } return; }
  /* tablero */
  if(b=e.target.closest('#segPer button')){ PER=b.dataset.per; renderTablero(); return; }
  /* filtros */
  if(b=e.target.closest('[data-filclear]')){
    const k=b.dataset.filclear; Object.keys(FIL[k]).forEach(x=>FIL[k][x]=''); render(); return; }
  /* excel */
  if(e.target.id==='btnXls'){ exportTab(); return; }
});
document.addEventListener('input', e=>{
  const fk=e.target.dataset.fil;
  if(fk!==undefined){
    const [k,campo]=fk.split('.'); FIL[k][campo]=e.target.value;
    clearTimeout(window._ft);
    window._ft=setTimeout(()=>{
      const pos=e.target.selectionStart, tipo=e.target.type;
      render();
      const n=document.querySelector(`[data-fil="${fk}"]`);
      if(n){ n.focus(); if(tipo==='text'||tipo===''){ try{ n.setSelectionRange(pos,pos); }catch(x){} } }
    }, 280);
    return;
  }
  if(e.target.id==='plazoDias'){ plazoDiasLibre=Math.max(0, parseInt(e.target.value)||0);
    clearTimeout(window._pd); window._pd=setTimeout(()=>{ renderResults(); renderCart();
      const el=$('#plazoDias'); if(el){ el.focus(); } }, 350); return; }
  if(e.target.dataset.qty!==undefined){ const k=+e.target.dataset.qty;
    cart[k].qty=Math.max(1, parseInt(e.target.value)||1); renderCart(); }
  else if(e.target.dataset.pqty!==undefined){ const k=+e.target.dataset.pqty;
    cart[k].qty=Math.max(1, parseInt(e.target.value)||1); renderPublicCart(); }
});
document.addEventListener('change', e=>{
  const fk=e.target.dataset.fil;
  if(fk!==undefined && e.target.tagName==='SELECT'){
    const [k,campo]=fk.split('.'); FIL[k][campo]=e.target.value; render(); return;
  }
  if(e.target.dataset.pu!==undefined){ const k=+e.target.dataset.pu;
    const v=Math.round(num(e.target.value)), auto=autoBase(refOf(cart[k]));
    cart[k].price = (v>0 && v!==auto) ? v : null; renderCart(); }
});

/* PDF público */
function buildPublicPrint(){
  let total=0;
  const rows=cart.map((it,k)=>{ const lt=it.venta*it.qty; total+=lt;
    return `<tr><td>${k+1}</td><td>${esc(it.descripcion)}</td><td>${esc(it.marca||'')}</td><td class="r">${it.qty}</td><td class="r">${fmt(it.venta)}</td><td class="r">${fmt(lt)}</td></tr>`; }).join('');
  const g=id=>esc(($('#'+id)&&$('#'+id).value)||'—');
  const today=new Date().toLocaleDateString('es-CO',{year:'numeric',month:'long',day:'numeric'});
  $('#print-root').innerHTML=`
    <div class="pr-head"><img src="${LOGO}"><div class="co"><span class="big">${EMPRESA.nombre}</span>${EMPRESA.desc}<br>${EMPRESA.contacto}</div></div>
    <div class="pr-title">COTIZACIÓN</div>
    <div class="pr-cli"><div><span>Cliente:</span>${g('p_nom')}</div><div><span>Fecha:</span>${today}</div>
      <div><span>Tel:</span>${g('p_tel')}</div><div><span>Ciudad:</span>${g('p_ciu')}</div></div>
    <table class="pr"><thead><tr><th>#</th><th>Descripción referencia</th><th>Marca</th><th class="r">Cant.</th><th class="r">Vlr unitario</th><th class="r">Vlr total</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="pr-tot"><div class="box"><span class="l">TOTAL</span><span class="v">${fmt(total)}</span></div></div>
    <div class="pr-cond">· Precios de contado en pesos colombianos (COP). No responsable de IVA: los valores no incluyen IVA.<br>
    · Cotización preliminar sujeta a disponibilidad de inventario. Consulta opciones de crédito y plazo.<br>
    · Corresponde únicamente al suministro de las llantas; no incluye instalación ni montaje. Despacho nacional.</div>`;
}

/* ================= SESIÓN ================= */
function showLogin(){ $('#login').style.display='grid'; $('#lerr').classList.remove('on'); setTimeout(()=>$('#lm').focus(),80); }
function hideLogin(){ $('#login').style.display='none'; }
async function doLogin(){
  const btn=$('#lbtn'), err=$('#lerr');
  err.classList.remove('on'); btn.disabled=true; btn.textContent='Entrando…';
  try{
    const r=await doAuth($('#lm').value.trim(), $('#lp').value);
    TOKEN=r.token; USER=r.email; UID=r.id||''; UCOL=r.col||'users';
    try{ localStorage.setItem('lcm_tk',TOKEN); localStorage.setItem('lcm_us',USER);
         localStorage.setItem('lcm_uid',UID); localStorage.setItem('lcm_col',UCOL); }catch(x){}
    hideLogin(); cart=[]; TAB='tablero';
    $('#view').innerHTML='<div class="load"><div class="spin"></div>Cargando tu información…</div>';
    await loadAll(); render(); $('#lp').value='';
  }catch(x){ err.textContent=x.message; err.classList.add('on'); }
  btn.disabled=false; btn.textContent='Entrar';
}
async function logout(){
  TOKEN=''; USER=''; cart=[]; TAB='cotizar';
  UID=''; try{ ['lcm_tk','lcm_us','lcm_uid','lcm_col'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
  DATA.catalogo=[];
  render();
  await loadCatalogo();
  if(!TOKEN) render();
}
$('#lbtn').addEventListener('click', doLogin);
['lm','lp'].forEach(id=>$('#'+id).addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); }));
$('#lback').addEventListener('click', async ()=>{
  hideLogin(); render();
  if(!TOKEN && !DATA.catalogo.length){ await loadCatalogo(); render(); }
});
$('#btnAccess').addEventListener('click', ()=>{ if(TOKEN) logout(); else showLogin(); });

/* ================= ARRANQUE ================= */
(async function init(){
  document.querySelectorAll('.lg-img').forEach(i=>{ i.src=LOGO; });
  ['icon','apple-touch-icon'].forEach(rel=>{
    const l=document.createElement('link'); l.rel=rel; l.href=LOGO; document.head.appendChild(l); });
  loadSet();
  hideLogin();
  $('#view').innerHTML='<div class="load"><div class="spin"></div>Cargando…</div>';
  let t='', u='';
  try{ t=localStorage.getItem('lcm_tk')||''; u=localStorage.getItem('lcm_us')||'';
       UID=localStorage.getItem('lcm_uid')||''; UCOL=localStorage.getItem('lcm_col')||'users'; }catch(e){}
  if(t){
    TOKEN=t; USER=u;
    try{
      await api('/api/collections/ventas/records?perPage=1&fields=id');
      TAB='tablero'; await loadAll(); render(); return;
    }catch(e){ TOKEN=''; USER=''; try{ localStorage.removeItem('lcm_tk'); }catch(x){} }
  }
  await loadCatalogo();
  render();
})();
</script>
